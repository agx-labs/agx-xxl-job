### 激活环境：由 Maven profile 注入（-P local/dev/prod），默认 local
spring:
  profiles:
    active: @spring.active@

  ### resources
  mvc:
    servlet:
      load-on-startup: 0
    static-path-pattern: /static/**
  web:
    resources:
      static-locations: classpath:/static/

  ### freemarker
  freemarker:
    template-loader-path: classpath:/templates/
    suffix: .ftl
    charset: UTF-8
    request-context-attribute: request
    settings:
      number_format: "0.##########"
      new_builtin_class_resolver: safer

  ### datasource
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      pool-name: HikariCP
      max-lifetime: 900000
      connection-timeout: 10000
      connection-test-query: SELECT 1
      validation-timeout: 1000

  ### mail
  mail:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
### web
server:
  port: 8081
  servlet:
    context-path: /xxl-job-admin

### actuator
management:
  endpoints:
    web:
      base-path: /actuator
  health:
    mail:
      enabled: false

### mybatis
mybatis:
  mapper-locations: classpath:/mapper/*Mapper.xml

### xxl-job（公共，不因环境变化的配置）
xxl:
  job:
    # i18n (default is zh_CN, and you can choose "zh_CN", "zh_TC" and "en")
    i18n: zh_CN
    # triggerpool max size
    triggerpool:
      fast:
        max: 300
      slow:
        max: 200
    # schedule batch size
    schedule:
      batchsize: 100
    # log retention days
    logretentiondays: 30

### xxl-sso（公共）
xxl-sso:
  token:
    key: xxl_job_login_token
    timeout: 604800000
  client:
    excluded:
      paths:
    login:
      path: /auth/login
